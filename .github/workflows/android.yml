name: Build Android APK

# Builds the Sahayak APK in the cloud on every push — download it from the
# Actions tab, no Android Studio needed. Debug-signed: fine for sideloading
# on your own phone (allow "install unknown apps" for your browser).
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sahayak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
